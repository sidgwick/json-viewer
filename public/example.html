<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <title>json-viewer</title>
    <script src="/wc.js"></script>
    <script>
      window.onload = function () {
        console.log("Hello World");

        const jv = document.createElement("json-viewer");

        jv.path = [];
        jv.showActionForm = true;
        jv.keyName = false;
        jv.value = {
          Hello: "hello",
          word: [1, 2, 3],
          escaped: "[1,2,3, 0.13478545645487878]",
          search: '{"key1": "abc", "status": 1}',
          data: { key1: "abc", status: 1 },
        };

        const app = document.getElementById("application");
        app.appendChild(jv);
      };
    </script>
  </head>
  <body>
    <!--
        BUILD Web Component with:
        
        ```bash
        yarn run build -- --target wc --name json-viewer --inline-vue src/components/JsonViewer.vue
        ```
     -->

    <div id="application"></div>
  </body>
</html>
